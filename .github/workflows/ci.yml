name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install fastapi==0.116.1 pydantic-settings==2.10.1 python-multipart==0.0.20 jinja2==3.1.6 httpx psutil pytest==8.4.1 ruff==0.12.8
      - run: ruff check app tests
      - run: python -m pytest -q
