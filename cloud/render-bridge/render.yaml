services:
  - type: web
    name: x-space-translator-bridge
    runtime: docker
    plan: free
    dockerfilePath: ./cloud/render-bridge/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 300
    envVars:
      - key: BRIDGE_API_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MAX_UPLOAD_MB
        value: "25"
      - key: JOB_TTL_SECONDS
        value: "1800"
      - key: PUBLIC_RATE_LIMIT_JOBS
        value: "2"
      - key: PUBLIC_RATE_LIMIT_WINDOW_SECONDS
        value: "600"
      - key: PUBLIC_MAX_AUDIO_SECONDS
        value: "7200"
